[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "timelapse"
dynamic = ["version"]
description = "Create time-lapse videos from baby monitor clips showing growth over time"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "opencv-python-headless>=4.8",
    "ultralytics>=8.1",
    "ffmpeg-python>=0.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[project.scripts]
timelapse = "timelapse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# writes src/timelapse/_version.py at install time
version_file = "src/timelapse/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
