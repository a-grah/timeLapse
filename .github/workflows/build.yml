name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest tests/ -v

  go-linux:
    name: Go (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: timelapse-go/go.sum

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config ffmpeg \
            libgtk2.0-dev libavcodec-dev libavformat-dev libswscale-dev \
            libtbb-dev libjpeg-dev libpng-dev libtiff-dev

      - name: Cache OpenCV
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/libopencv*
            /usr/local/lib/pkgconfig/opencv4.pc
            /usr/local/lib/cmake/opencv4
            /usr/local/include/opencv4
          key: opencv-4.10.0-ubuntu-22.04-v1

      - name: Build and install OpenCV 4.10
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --branch v0.43.0 \
            https://github.com/hybridgroup/gocv.git /tmp/gocv
          cd /tmp/gocv
          sudo make install

      - name: Update ldconfig
        run: sudo ldconfig

      - name: Test
        working-directory: timelapse-go
        run: go test ./...

      - name: Build
        working-directory: timelapse-go
        run: |
          VERSION=$(git describe --tags --always --dirty)
          go build -ldflags "-X main.version=${VERSION}" -o timelapse-linux-amd64 .

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: timelapse-go/timelapse-linux-amd64

  go-macos:
    name: Go (macos/arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: timelapse-go/go.sum

      - name: Install OpenCV and ffmpeg
        run: brew install opencv ffmpeg

      - name: Test
        working-directory: timelapse-go
        env:
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig
          CGO_CPPFLAGS: ${{ '' }}
          CGO_LDFLAGS: ${{ '' }}
        run: |
          export CGO_CPPFLAGS=$(pkg-config --cflags opencv4)
          export CGO_LDFLAGS=$(pkg-config --libs opencv4)
          go test ./...

      - name: Build
        working-directory: timelapse-go
        run: |
          export PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig
          export CGO_CPPFLAGS=$(pkg-config --cflags opencv4)
          export CGO_LDFLAGS=$(pkg-config --libs opencv4)
          VERSION=$(git describe --tags --always --dirty)
          go build -ldflags "-X main.version=${VERSION}" -o timelapse-macos-arm64 .

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: timelapse-go/timelapse-macos-arm64
