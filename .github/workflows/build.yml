name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest tests/ -v

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config ffmpeg \
            libgtk2.0-dev libavcodec-dev libavformat-dev libswscale-dev \
            libtbb-dev libjpeg-dev libpng-dev libtiff-dev

      - name: Download Go modules
        working-directory: timelapse-go
        run: go mod download

      - name: Cache OpenCV
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/libopencv*
            /usr/local/include/opencv4
            /usr/local/lib/pkgconfig/opencv4.pc
          key: opencv-4.10.0-ubuntu-22.04-v1

      - name: Build OpenCV
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: |
          GOCV_DIR=$(go env GOPATH)/pkg/mod/gocv.io/x/gocv@v0.43.0
          cd "$GOCV_DIR"
          make install

      - name: Update ldconfig
        run: sudo ldconfig

      - name: Test
        working-directory: timelapse-go
        run: go test ./...

      - name: Build
        working-directory: timelapse-go
        run: |
          VERSION=$(git describe --tags --always --dirty)
          go build -ldflags "-X main.version=${VERSION}" -o timelapse .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: timelapse-linux-amd64
          path: timelapse-go/timelapse
