name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest tests/ -v

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install OpenCV and ffmpeg
        run: sudo apt-get install -y libopencv-dev ffmpeg

      - name: Test
        working-directory: timelapse-go
        run: go test ./...

      - name: Build
        working-directory: timelapse-go
        run: |
          VERSION=$(git describe --tags --always --dirty)
          go build -ldflags "-X main.version=${VERSION}" -o timelapse .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: timelapse-linux-amd64
          path: timelapse-go/timelapse
